name: 资料投稿或勘误 · Knowledge
description: 分享临帖观察、学习体会、碑帖线索、馆藏出处或一处勘误；可只用中文。提交后会成为公开的 GitHub Issue，由编辑核对来源。
title: "[资料] "
labels: ["knowledge"]
body:
  - type: input
    id: subject
    attributes:
      label: 想补充哪件作品、实物或哪位书家？
      placeholder: 例如《颜勤礼碑》故宫藏民国拓本，新00045406
    validations:
      required: true
  - type: textarea
    id: claim
    attributes:
      label: 想补充、纠正或分享什么？
      description: 一次写一件事。资料与勘误请写明出处；读帖观察、学习体会或疑问可写明具体版本、哪一字或哪一行，以及别人怎样复看。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 在哪里能核对？
      description: 网页请附链接和段落，书刊请附版本、卷页或图版号。只有线索可写「待查」；学习体会可写「个人观察」。
    validations:
      required: true
  - type: textarea
    id: reflection
    attributes:
      label: 还想分享什么？（选填）
      description: 学习中的疑问、访碑或观展所见、讨论中的想法。个人观点与事实性知识会分开处理，署名与原创表达归你所有。
  - type: textarea
    id: uncertainty
    attributes:
      label: 哪些地方仍有疑问？
      description: 可附其他说法及其出处；相冲突的著录会分别保留，不替你裁决。
  - type: textarea
    id: credit
    attributes:
      label: 图片权利与署名（选填）
      description: 可给馆藏图页链接。如附图，请说明摄影者、来源、许可和署名方式。可用 GitHub 名或笔名。请勿填写隐私联系方式。
