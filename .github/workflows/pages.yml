name: Publish GitHub Pages release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-release
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        id: pages
      - run: npm ci
      - run: npm run check
        env:
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          VITE_RELEASE_MODE: '0'
          VITE_TIANDITU_KEY: ''
      - name: Build the release artifact
        run: npm run release
        env:
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          VITE_TIANDITU_KEY: ${{ secrets.TIANDITU_BROWSER_KEY }}
      - name: Verify the release marker and manifest
        run: |
          grep -F 'name="beitie-build-mode" content="release"' dist/index.html
          node -e "const m=require('./dist/release-manifest.json'); if(m.mode!=='release'||m.releaseMode!==true) { console.error('not a release manifest'); process.exit(1); } console.log('release manifest counts', JSON.stringify(m.counts));"
      - name: Verify the downloadable author library
        run: |
          python3 - <<'PY'
          import json, os, zipfile
          with zipfile.ZipFile('dist/download/beitie-knowledge.zip') as library:
              assert library.testzip() is None
              manifest = json.loads(library.read('manifest.json'))
              assert manifest['sourceRevision'] == os.environ['GITHUB_SHA']
              assert 'knowledge/README.md' in library.namelist()
          PY
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
