name: Publish project overview

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: project-overview-pages
  cancel-in-progress: false

jobs:
  pages:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage project overview
        run: |
          mkdir -p "${RUNNER_TEMP}/public-overview"
          install -m 644 site/index.html site/styles.css "${RUNNER_TEMP}/public-overview/"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/public-overview
      - uses: actions/deploy-pages@v4
        id: deployment
