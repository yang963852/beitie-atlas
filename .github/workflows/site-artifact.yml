name: Site artifact

# Produces the exact directory that the Codex Sites upload consumes, from an
# explicitly chosen revision, and keeps it as a versioned artifact.
#
# Why this exists: the Site upload used to be the only step with no record. A
# preview and a release now differ in a checked way (`beitie-build-mode` in
# index.html plus a release manifest), and every upload can name the revision and
# the artifact it came from.
#
# What this workflow deliberately does NOT do: upload to the Site. There is no
# Site credential in CI, and adding one would put write access to the public site
# behind a workflow file. The owner still runs the upload; this supplies the
# verified input and its identity.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'preview (drafts allowed, marked preview) or release (strict gate)'
        type: choice
        options: [preview, release]
        default: preview
      base_path:
        description: 'Base path the artifact is built for, e.g. / or /beitie-atlas/'
        default: '/'

permissions:
  contents: read

concurrency:
  group: site-artifact-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Resolve inputs
        id: inputs
        run: |
          base_path="${{ inputs.base_path }}"
          case "$base_path" in
            /*) ;;
            *) echo "base_path must start with / — got '$base_path'"; exit 1 ;;
          esac
          echo "base_path=$base_path" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # A preview is allowed to contain drafts and says so in the HTML. A release
      # runs the strict gate and fails while any record is still draft — that
      # failure is the correct answer, not a broken workflow.
      - name: Build (preview)
        if: inputs.mode == 'preview'
        env:
          VITE_BASE_PATH: ${{ steps.inputs.outputs.base_path }}
          VITE_RELEASE_MODE: '0'
        run: npm run build

      - name: Build (release, strict gate)
        if: inputs.mode == 'release'
        run: npm run release

      - name: Verify the artifact says what it is
        env:
          MODE: ${{ inputs.mode }}
        run: |
          node - <<'NODE'
          const { existsSync, readFileSync } = require('node:fs');
          const mode = process.env.MODE;
          const html = readFileSync('dist/index.html', 'utf8');
          const marker = new RegExp(`name="beitie-build-mode" content="${mode}"`);
          if (!marker.test(html)) {
            console.error(`dist/index.html does not carry the ${mode} marker.`);
            process.exit(1);
          }
          if (mode === 'release') {
            if (!existsSync('dist/release-manifest.json')) {
              console.error('dist/release-manifest.json is missing from a release artifact.');
              process.exit(1);
            }
            const manifest = JSON.parse(readFileSync('dist/release-manifest.json', 'utf8'));
            if (manifest.mode !== 'release') {
              console.error('The release manifest does not describe a release build.');
              process.exit(1);
            }
            console.log(`Counts: ${JSON.stringify(manifest.counts)}`);
          }
          console.log(`Verified ${mode} marker.`);
          NODE

      - name: Summarize
        run: |
          {
            echo "### Site artifact"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Revision | \`${{ steps.inputs.outputs.revision }}\` |"
            echo "| Mode | \`${{ inputs.mode }}\` |"
            echo "| Base path | \`${{ steps.inputs.outputs.base_path }}\` |"
            echo "| Artifact | \`beitie-${{ inputs.mode }}-${{ steps.inputs.outputs.short }}\` |"
            echo "| Source manifest | \`.openai/hosting.json\` -> \`build/\` stays the overview; this workflow stages the atlas |"
            echo ""
            echo "The Sites upload itself is an owner-authorized step. Record this revision and"
            echo "the Site version together in the delivery report."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: beitie-${{ inputs.mode }}-${{ steps.inputs.outputs.short }}
          path: dist/
          retention-days: 30
          if-no-files-found: error
