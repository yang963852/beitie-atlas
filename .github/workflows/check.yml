name: Quality checks and release tag verification

# Runs on every pull request and on task branches. This workflow checks; it does
# not deploy. The strict gate is `npm run check:release`, and publishing stays
# with the owner: a rejected corpus fails this run instead of surfacing only in
# the Pages workflow after the merge. A formal `v*` tag is checked against its
# own commit; ordinary branches are never required to carry a tag.

on:
  pull_request:
  push:
    branches: [main, 'task/**']
    tags: ['v*']

permissions:
  contents: read

# A newer push supersedes an in-flight run on the same ref: a stale green check
# must not be read as the current state of the branch.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Pinned to a commit, not a tag: a moved tag would silently change what CI
      # runs. Comments record the release each commit belongs to.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whitespace check below compares against the base revision, so
          # the history has to be present.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Trailing whitespace and conflict markers are cheap to catch here and
      # invisible in a green test run.
      - name: Check the changed range for whitespace errors and conflict markers
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || ! git rev-parse --verify --quiet "$BASE_SHA^{commit}" >/dev/null; then
            echo "No comparable base revision for this run; checking the working tree only."
            git diff --check
          else
            git diff --check "$BASE_SHA" HEAD
          fi
      - run: npm run check
      # The strict gate fails this run. The corpus currently has no draft
      # records, so `npm run check:release` passes today; a later draft or
      # invalid record must block the pull request, not only the Pages release.
      # `if: always()` keeps the gate report in the log after an earlier failure;
      # that earlier failure already decides the job.
      - name: Strict release gate
        if: always()
        run: npm run check:release
      # Only a formal tag push runs this. It checks the tag against the package
      # version, CHANGELOG section, annotated tag object and main ancestry.
      - name: Verify the formal release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm run check:tag -- "${GITHUB_REF_NAME}"
