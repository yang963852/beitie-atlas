name: Preview quality checks
on:
  pull_request:
  push:
    branches: [main, 'task/**', 'codex/**']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build:overview
# These checks do not deploy either artifact. The interactive atlas release
# still requires the strict gate described in docs/release.md.
